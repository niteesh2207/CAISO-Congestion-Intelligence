function switchRow(name,desc,key){return `<div class="switch-row"><div class="switch-copy"><b>${name}</b><span>${desc}</span></div><div class="toggle on" data-key="${key}" onclick="toggleMapLayer(this)"></div></div>`}function legend(color,name,desc){return `<div class="legend-card"><div class="legend-line" style="background:${color}"></div><div class="legend-copy"><b>${name}</b><span>${desc}</span></div></div>`}function score(label,pct,val){return `<div class="score"><div class="label">${label}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="val">${val}</div></div>`}
const content={story:{eyebrow:'Congestion story',title:'What is happening?',body:`<p>The map tells the congestion story visually before the user reads technical details.</p><div class="story-chain"><div class="story-step">Path unavailable</div><div class="arrow">→</div><div class="story-step">Power redistributes</div><div class="arrow">→</div><div class="story-step">Monitored line stressed</div></div><p><b>Plain English:</b> the purple path represents the contingency. When it is unavailable, the grid has fewer electrical routes. The surviving network can carry more of the transfer, increasing stress on the orange/red monitored USWP/Lone Tree–Cayetano facility.</p><div class="factchips"><span class="factchip fact">CAISO FACT</span><span class="factchip infer">ENGINEERING INFERENCE</span><span class="factchip market">MARKET INTERPRETATION</span></div><div class="source-box">Exact MW redistribution, PTDF/LODF and interval-specific market direction must come from solved network / market data rather than map appearance alone.</div>`},trader:{eyebrow:'Trader intelligence',title:'What makes this constraint stronger or weaker?',body:`
<div class="trader-hero">
  <div class="node-card source-node"><div class="node-kicker">Source side</div><b>Injection / export pressure</b><span>Nodes or resources whose incremental injection tends to increase flow on the monitored USWP/Lone Tree → Cayetano direction. In this prototype, think of the Contra Costa / Lone Tree resource-side corridor as the working source-side concept.</span></div>
  <div class="node-card sink-node"><div class="node-kicker">Sink side</div><b>Withdrawal / load pull</b><span>Nodes or loads whose incremental withdrawal tends to pull more power across the monitored path. The downstream North Dublin / Newark / Greater Bay area is the working sink-side concept.</span></div>
</div>
<div class="direction-note"><b>Important:</b> “from bus” and “to bus” are not automatically source and sink. The production chatbot should classify source/sink from PTDF / market sensitivities for the actual interval. A battery can also switch roles: <b>charging = sink/load</b>; <b>discharging = source/generation</b>.</div>
<div class="driver-title"><b>Binding strength matrix</b><span class="priority-pill">TRADER VIEW</span></div>
<div class="trade-table-wrap"><table class="trade-table"><thead><tr><th>Primary driver</th><th>Stronger binding</th><th>Weaker binding</th><th>What the trader should watch</th></tr></thead><tbody>
<tr><td>Source-side generation</td><td><span class="strong">Higher injections</span> from resources with positive PTDF to the monitored direction add transfer pressure.</td><td><span class="weak">Lower output / curtailment</span> reduces source-side push.</td><td><span class="watch">Solar, wind, thermal dispatch, resource outages, curtailment.</span></td></tr>
<tr><td>Sink-side load</td><td><span class="strong">Higher Greater Bay withdrawals</span> can increase pull across the corridor.</td><td><span class="weak">Lower demand</span> reduces required transfer.</td><td><span class="watch">Load forecast error, temperature, evening ramp, local demand.</span></td></tr>
<tr><td>Battery behavior</td><td><span class="strong">Charging on the sink side</span> behaves as load; <span class="strong">discharge on the source side</span> behaves as injection.</td><td><span class="weak">Sink-side discharge</span> or <span class="weak">source-side charging</span> can relieve the transfer, subject to PTDF.</td><td><span class="watch">Storage charging MW, discharge MW, SOC, price spread.</span></td></tr>
<tr><td>Local sink generation</td><td><span class="strong">Lower local generation / unit outage</span> forces more imports into the sink pocket.</td><td><span class="weak">Higher local generation</span> serves load locally and can reduce corridor imports.</td><td><span class="watch">Bay Area thermal availability, unit outages, derates.</span></td></tr>
<tr><td>Imports / exports</td><td><span class="strong">Transfer schedules that reinforce the constrained direction</span> raise loading.</td><td><span class="weak">Counter-flow schedules</span> or lower reinforcing imports/exports relieve loading.</td><td><span class="watch">Intertie schedules, interchange changes, loop flow.</span></td></tr>
<tr><td>Parallel line outage</td><td><span class="strong">Positive LODF outage</span> shifts part of the lost line flow onto the monitored branch.</td><td><span class="weak">Negative LODF outage</span> can create counter-flow / relief.</td><td><span class="watch">Outage list + current-case LODF magnitude and sign.</span></td></tr>
<tr><td>Line rating / derate</td><td><span class="strong">Lower emergency/operating limit</span> means the same MW flow uses more of the constraint capability.</td><td><span class="weak">Higher available rating</span> increases headroom.</td><td><span class="watch">Temporary derates, ambient ratings, equipment limitations.</span></td></tr>
<tr><td>Topology / model change</td><td><span class="strong">Switching or topology that removes alternate paths</span> concentrates flow.</td><td><span class="weak">Restored paths / beneficial switching</span> spreads flow across the network.</td><td><span class="watch">FNM changes, breaker status, planned/unplanned topology.</span></td></tr>
</tbody></table></div>
<div class="lodf-box"><b>LODF — the outage sensitivity the trader wants</b><p style="margin:6px 0 0">Line Outage Distribution Factor estimates how much of an outaged line’s pre-outage flow appears on the monitored facility after the outage.</p><div class="formula">ΔF(monitored) ≈ LODF(monitored,outage) × F(outage, pre)</div><div class="lodf-grid"><div class="lodf-mini"><b>+ LODF</b><span>Outage adds flow → stronger risk</span></div><div class="lodf-mini"><b>− LODF</b><span>Outage relieves flow → weaker risk</span></div><div class="lodf-mini"><b>|LODF| ↑</b><span>Larger absolute sensitivity → more impactful</span></div></div></div>
<h4>Impactful outage watchlist for this corridor</h4>
<div class="outage-row"><div><span class="name">Contra Costa – Las Positas 230 kV</span><span class="why">Direct user-supplied contingency; CAISO historical reliability studies explicitly overloaded Cayetano–Lone Tree under this N-1.</span></div><span class="rank vh">VERY HIGH</span><span class="lodf-state">LODF: solve current case</span></div>
<div class="outage-row"><div><span class="name">Las Positas – Newark 230 kV</span><span class="why">CAISO reliability assessment also identified this N-1 as stressing the same Cayetano–Lone Tree corridor.</span></div><span class="rank h">HIGH</span><span class="lodf-state">LODF: solve current case</span></div>
<div class="outage-row"><div><span class="name">Tesla – Newark 230 kV #1 / #2</span><span class="why">Multiple CAISO planning cases identify Newark/Tesla contingencies as electrically relevant to this Greater Bay corridor.</span></div><span class="rank h">HIGH</span><span class="lodf-state">LODF: solve current case</span></div>
<div class="outage-row"><div><span class="name">Newark 230-kV bus/section outages</span><span class="why">Historical P2 bus/breaker cases increased loading on Cayetano–Lone Tree; useful topology watch items.</span></div><span class="rank m">MED–HIGH</span><span class="lodf-state">LODF/N-2: case dependent</span></div>
<div class="source-box"><b>Current structural signal:</b> CAISO’s May 2026 policy assessment still identifies Cayetano–Lone Tree (Lone Tree–USWP) as an on-peak Greater Bay deliverability constraint. The exact outage ranking for a trading interval should be recalculated against the applicable FNM and actual outage state.</div>
<h4>Trader’s 60-second checklist</h4><div class="checklist"><div class="check"><b>1 · OASIS constraint</b><span>Shadow price, market process, reason / contingency.</span></div><div class="check"><b>2 · Outage topology</b><span>Which parallel paths are out or derated?</span></div><div class="check"><b>3 · Source injections</b><span>Renewables, thermal, battery discharge, imports.</span></div><div class="check"><b>4 · Sink withdrawals</b><span>Load, battery charging, local generation availability.</span></div><div class="check"><b>5 · PTDF / LODF</b><span>Direction, sign and magnitude determine actual impact.</span></div><div class="check"><b>6 · Price confirmation</b><span>MCC/LMP separation should agree with the network story.</span></div></div>
`},layers:{eyebrow:'Map controls',title:'Choose what the map shows',body:`${switchRow('Network context','Supporting corridor and substations','context')}${switchRow('Monitored constraint','Highlighted USWP/Lone Tree–Cayetano branch','monitored')}${switchRow('Contingency','Named Contra Costa–Las Positas outage path','contingency')}${switchRow('Source / sink pockets','Conceptual resource-side and load-side zones','zones')}${switchRow('Power-flow animation','Directional conceptual redistribution overlay','flow')}${switchRow('Map labels','Constraint and contingency labels','labels')}`},legend:{eyebrow:'Visual language',title:'Map legend',body:`${legend('#ff5b4d','Monitored facility','Primary branch being constrained / monitored.')}${legend('#7a5cff','Contingency','Path represented as unavailable in the N-1 story.')}${legend('#00a7b7','Power-flow animation','Conceptual direction used to explain redistribution.')}${legend('#2dbf93','Resource-side pocket','Conceptual source-side region.')}${legend('#ffb02e','Load-side pocket','Conceptual Greater Bay sink/load-side region.')}${legend('#466579','Supporting grid','Nearby transmission context.')}<div class="source-box">Each color has one stable meaning across future constraints.</div>`},mode:{eyebrow:'User experience',title:'Explanation level',body:`<div class="mode-grid"><div class="mode-card active" onclick="selectMode(this,'Beginner')"><b>Beginner</b><span>What failed, what became stressed, and where power is trying to move.</span></div><div class="mode-card" onclick="selectMode(this,'Analyst')"><b>Analyst</b><span>Add shadow price, MCC, binding history, batteries, DA/RT and congestion exposure.</span></div><div class="mode-card" onclick="selectMode(this,'Engineer')"><b>Engineer</b><span>Add N-1, PTDF/LODF, post-contingency loading, network sensitivities and model evidence.</span></div></div><div class="source-box" id="modeResult"><b>Current:</b> Beginner — map-first explanation with minimal terminology.</div>`},evidence:{eyebrow:'Trust layer',title:'Evidence & confidence',body:`${score('Constraint identity',98,'Very high')}${score('Corridor context',95,'Very high')}${score('FNM cycle context',100,'Verified')}${score('Source / sink story',76,'Inferred')}${score('Exact MW flow',12,'Not asserted')}<h4>Current evidence context</h4><p>CAISO deployed <b>26M6_DB141</b> into production on June 17, 2026. CAISO’s 2025–26 Transmission Plan describes the 230-kV path from Contra Costa to Newark and specifically discusses Cayetano–Lone Tree and Las Positas–Newark.</p><div class="source-box"><b>Geospatial caution:</b> substation coordinates in this prototype are illustrative regional placements. The production product should use a curated CAISO/PTO geospatial registry with explicit coordinate confidence.</div>`}};
function openDrawer(type){const d=content[type];document.getElementById('drawerEyebrow').textContent=d.eyebrow;document.getElementById('drawerTitle').textContent=d.title;document.getElementById('drawerBody').innerHTML=d.body;document.getElementById('drawer').classList.add('open')}function closeDrawer(){document.getElementById('drawer').classList.remove('open')}function toggleMapLayer(el){const key=el.dataset.key,g=layers[key];if(map.hasLayer(g)){map.removeLayer(g);el.classList.remove('on')}else{g.addTo(map);el.classList.add('on')}}function selectMode(el,name){document.querySelectorAll('.mode-card').forEach(x=>x.classList.remove('active'));el.classList.add('active');const msg={Beginner:'map-first explanation with minimal terminology.',Analyst:'adds market pricing, shadow-price and congestion interpretation.',Engineer:'adds network sensitivity and post-contingency engineering detail.'};document.getElementById('modeResult').innerHTML=`<b>Current:</b> ${name} — ${msg[name]}`}function fitMap(){map.fitBounds([[37.43,-122.19],[38.10,-121.61]],{paddingTopLeft:[45,120],paddingBottomRight:[85,75]})}function analyze(){fitMap();openDrawer('story')}map.on('click',()=>closeDrawer());fitMap();
